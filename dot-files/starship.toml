# Repo-managed starship config — symlinked to ~/.config/starship.toml by
# clean-install-zsh.sh.
#
# Customise interactively with: starship config

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
# Braces are required around ${custom.*} in format strings — the module names
# contain dots.
format = "$username${custom.host_icon}$hostname$directory${custom.git_forge}$git_branch$git_status$character"
right_format = "$cmd_duration$jobs${custom.mise_tools}$time"

[username]
show_always = true
style_user = "#808080"
format = "[$user]($style) "

[hostname]
ssh_only = false
style = "#808080"
format = "[$hostname]($style) "

[custom.host_icon]
# Starship's hostname module only knows the SSH-only ssh_symbol, so the device
# icon is a custom module (one sh subprocess per prompt).
format = "([$output](#FF8700) )"
when = true
command = '''
if [ -n "$SSH_CONNECTION$SSH_CLIENT$SSH_TTY" ]; then
  printf '\357\222\230'  # U+F498 nf-md-remote-desktop
else
  printf '\357\222\251'  # U+F4A9 nf-oct-device_desktop
fi
'''

[directory]
style = "#0087AF"
before_repo_root_style = "#0087AF"
repo_root_style = "bold #00AFFF"
# Keep the pre-repo part visible; shorten only when long.
truncate_to_repo = false
truncation_length = 5
# U+F023 lock, not the default emoji.
read_only = ""
read_only_style = "#0087AF"

[custom.git_forge]
# Starship has no built-in forge icons, so this shells out to git: two
# subprocesses per prompt inside a repo. Drop this block and restore the
# git_branch symbol if that cost matters.
format = "([$output](#5FD700) )"
# Custom modules are hidden by default; outside a repo the command stays
# silent and the conditional format renders nothing.
when = true
command = '''
git rev-parse --git-dir >/dev/null 2>&1 || exit 0
url=$(git remote get-url origin 2>/dev/null)
case "$url" in
  *github*)    printf '\357\204\223' ;;  # U+F113 github-alt
  *gitlab*)    printf '\357\212\226' ;;  # U+F296 gitlab
  *bitbucket*) printf '\356\234\203' ;;  # U+E703 bitbucket
  *)           printf '\357\204\246' ;;  # U+F126 code-fork fallback
esac
'''

[git_branch]
style = "#5FD700"
truncation_length = 32
format = "[$branch(:$remote_branch)]($style) "

[git_status]
# Per-symbol colours come from the format, not the module style. Overriding a
# symbol replaces its default, so $count must be spelled out explicitly.
format = "([$ahead_behind](#5FD700)[$stashed](#5FD700)[$conflicted](#FF0000)[$renamed]($style)[$staged]($style)[$modified]($style)[$deleted]($style)[$untracked](#00AFFF))"
style = "#D7AF00"
stashed = "*$count "
conflicted = "~$count "
renamed = "»$count "
staged = "+$count "
modified = "!$count "
deleted = "!$count "
untracked = "?$count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇣$behind_count⇡$ahead_count "

[character]
success_symbol = "[❯](#5FD700)"
error_symbol = "[❯](#FF0000)"
vimcmd_symbol = "[❮](#5FD700)"
vimcmd_visual_symbol = "[V](#5FD700)"
vimcmd_replace_symbol = "[▶](#5FD700)"
vimcmd_replace_one_symbol = "[▶](#5FD700)"

[cmd_duration]
min_time = 3000
style = "#87875F"
format = "[$duration]($style) "

[jobs]
# U+F013 (cog); number_threshold is set high so the count never shows.
symbol = " "
style = "#5FAF00"
number_threshold = 99
format = "[$symbol$number]($style) "

[time]
disabled = false
style = "#808080"
format = "[$time]($style) "

# ── tool versions (mise) ────────────────────────────────────────
# `mise current` reports the versions applied for this directory (from
# .tool-versions, mise.toml or idiomatic files), reduced to the major number
# (corretto-21.0.6.7 -> 21). Globals such as gh are filtered out by the case —
# add case lines to show more.

[custom.mise_tools]
format = "([$output](#5F8787) )"
when = true
command = '''
entry() {
  major=$(printf '%s\n' "$2" | sed -n 's/^[^0-9]*\([0-9][0-9]*\).*/\1/p')
  [ -n "$major" ] || return 0
  printf "$1 %s " "$major"
}
mise current 2>/dev/null | while read -r tool ver; do
  case "$tool" in
    node*)   entry '\356\230\227' "$ver" ;;  # U+E617 nodejs
    python*) entry '\356\234\274' "$ver" ;;  # U+E73C python
    java)    entry '\356\234\270' "$ver" ;;  # U+E738 java
    jfrog*)  entry '\357\206\207' "$ver" ;;  # U+F187 fa-archive — this font has no frog (U+F52B is MD "abc"; v3's U+EDF8 is absent)
    *) ;;
  esac
done
'''
